<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Philopater Shenouda | Portfolio</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query string
      // into just a query string, and then redirects the browser to the new url
      // with only a query string and hash fragment, e.g. http://www.foo.tld/one/two?a=b#c
      // becomes http://www.foo.tld/?/one/two&a=b#c
      // Note: this logic is custom to the /Portfolio/ base path
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.replace(/&/g, "~and~").replace(/\?/g, "~q~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
